name: android-build-guard

# Compile-guard for the Android port (07b33b00). The web side has
# css-build-guard; this gives the Kotlin app the same protection: a Kotlin /
# AGP compile error can no longer land on main silently. Runs the real
# `assembleDebug` (no signing needed) on every push/PR to main.
#
# First run downloads Gradle 8.11.1 + the Android SDK — expect 5-10 min.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-build-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compile debug APK (catches Kotlin/Android build errors)
        run: ./gradlew assembleDebug --no-daemon
